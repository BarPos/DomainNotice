# GitHub Pages site for DomainNotice (Settings → Pages → Deploy from a branch → main, /docs).
title: DomainNotice
description: Announcements that every domain PC shows until the user responds.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false

search_enabled: true
heading_anchors: true
color_scheme: light
back_to_top: true
back_to_top_text: "Back to top"
footer_content: "DomainNotice documentation."

url: "https://barpos.github.io"
baseurl: "/DomainNotice"
aux_links:
  "DomainNotice on GitHub": "https://github.com/BarPos/DomainNotice"
  "Releases": "https://github.com/BarPos/DomainNotice/releases"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/BarPos/DomainNotice"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
