# Build and test. Runs only when started by hand (Actions → build → Run workflow) and as part of release.yml.
# Produces downloadable artifacts (no release):
#   server: DomainNotice.Server-<version>-linux-x64.tar.gz, DomainNotice.Server-<version>-linux-arm64.tar.gz, install.sh
#   agent:  DomainNotice.Agent-<version>-x64.msi (WiX 5 on Windows)
name: build

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "Version from Directory.Build.props"
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          app="$(sed -n 's:.*const string Current = "\([^"]*\)".*:\1:p' DomainNotice.Shared/AppVersion.cs | head -n1)"
          [[ "$version" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]] || { echo "::error::Directory.Build.props version '$version' is not x.y.z"; exit 1; }
          [[ "$app" == "$version" ]] || { echo "::error::AppVersion.Current ($app) does not match Directory.Build.props ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Shell checks
        shell: bash
        run: |
          set -euo pipefail
          for f in build/build-server.sh deploy/linux/install.sh deploy/linux/update.sh deploy/linux/tests/*.sh testenv/*.sh testenv/dc/*.sh; do bash -n "$f"; done
          # shellcheck findings are reported but do not fail the build.
          if command -v shellcheck >/dev/null; then
            shellcheck -x -S warning build/build-server.sh deploy/linux/*.sh deploy/linux/tests/*.sh ||
              echo "::warning::shellcheck reported findings (non-blocking)"
          fi
          deploy/linux/update.sh --self-test
          deploy/linux/tests/update-functions-test.sh
      - name: Build solution
        run: dotnet build DomainNotice.sln -c Release
      - name: Server tests (PostgreSQL 16 via Testcontainers)
        run: dotnet test --project DomainNotice.Server.Tests
      - name: Agent logic tests
        run: dotnet test --project DomainNotice.Agent.Tests

  server:
    name: Server + Console tarballs
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: build-server.sh
        run: build/build-server.sh --arch x64 --arch arm64
      - name: Check asset names
        shell: bash
        run: |
          v='${{ needs.version.outputs.version }}'
          test -f "artifacts/DomainNotice.Server-$v-linux-x64.tar.gz"
          test -f "artifacts/DomainNotice.Server-$v-linux-arm64.tar.gz"
          test -f artifacts/install.sh
          # List to a file first: "tar | grep -q" makes tar fail with a write error under pipefail.
          tar -tzf "artifacts/DomainNotice.Server-$v-linux-x64.tar.gz" > "$RUNNER_TEMP/server-files.txt"
          grep -q 'wwwroot/_framework/blazor.web.js' "$RUNNER_TEMP/server-files.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          if-no-files-found: error
          path: |
            artifacts/DomainNotice.Server-*.tar.gz
            artifacts/install.sh

  agent:
    name: Agent MSI
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: build-agent-msi.ps1
        shell: pwsh
        run: ./build/build-agent-msi.ps1
      - name: Check asset name
        shell: pwsh
        run: |
          $msi = "artifacts/DomainNotice.Agent-${{ needs.version.outputs.version }}-x64.msi"
          if (-not (Test-Path $msi)) { throw "build-agent-msi.ps1 did not produce $msi" }
          Get-FileHash -Algorithm SHA256 $msi | Format-List
      - uses: actions/upload-artifact@v7
        with:
          name: agent
          if-no-files-found: error
          path: artifacts/DomainNotice.Agent-*-x64.msi
